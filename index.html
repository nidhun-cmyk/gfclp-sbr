<script>

/* ============================================================
   GFC SBR LANDING PAGE
   CALL + WHATSAPP CLICK TRACKING
   ============================================================ */

var CTA_TRACKING_URL =
  "https://script.google.com/macros/s/AKfycbw4tKDvLLyGByFsGdWxhwaPJQq1bLdWFwCPLGDOYTld34jnH2pE9lx8WiMGm1twt-yB/exec";


/* ============================================================
   GOOGLE ADS / UTM ATTRIBUTION
   ============================================================ */

function getTrackingParams() {

  var qs = new URLSearchParams(window.location.search);

  return {
    utm_source: qs.get('utm_source') || '',
    utm_medium: qs.get('utm_medium') || '',
    utm_campaign: qs.get('utm_campaign') || '',
    utm_term: qs.get('utm_term') || '',
    utm_content: qs.get('utm_content') || '',
    gclid: qs.get('gclid') || '',
    gbraid: qs.get('gbraid') || '',
    wbraid: qs.get('wbraid') || ''
  };
}


/* ============================================================
   DEVICE
   ============================================================ */

function getDeviceType() {

  return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
    ? 'mobile'
    : 'desktop';
}


/* ============================================================
   BUTTON LOCATION
   ============================================================ */

function getButtonLocation(element) {

  if (!element) return 'unknown';

  if (
    element.dataset &&
    element.dataset.trackLocation
  ) {
    return element.dataset.trackLocation;
  }

  if (
    element.closest &&
    element.closest('.mobile-cta')
  ) {
    return 'mobile_sticky';
  }

  if (
    element.closest &&
    element.closest('.site-header')
  ) {
    return 'header';
  }

  if (
    element.closest &&
    element.closest('#lead-form-card')
  ) {
    return 'form';
  }

  if (
    element.closest &&
    element.closest('#packages')
  ) {
    return 'pricing';
  }

  if (
    element.closest &&
    element.closest('.mid-cta-section')
  ) {
    return 'mid_cta';
  }

  if (
    element.closest &&
    element.closest('.lp-footer')
  ) {
    return 'footer';
  }

  if (
    element.closest &&
    element.closest('.hero')
  ) {
    return 'hero';
  }

  if (
    element.closest &&
    element.closest('.penalty-ticker')
  ) {
    return 'penalty_ticker';
  }

  return 'unknown';
}


/* ============================================================
   BUTTON TEXT
   ============================================================ */

function getButtonText(element) {

  if (!element) return '';

  return (
    element.innerText ||
    element.textContent ||
    ''
  )
    .replace(/\s+/g, ' ')
    .trim()
    .substring(0, 250);
}


/* ============================================================
   SEND EVENT TO GOOGLE SHEET
   ============================================================ */

function trackCTA(
  eventType,
  buttonLocation,
  buttonText,
  destination
) {

  if (!CTA_TRACKING_URL) return;

  var attribution = getTrackingParams();

  var data = {

    event_type: eventType,

    button_location:
      buttonLocation || 'unknown',

    button_text:
      (buttonText || '').trim(),

    destination:
      destination || '',

    page_url:
      window.location.href,

    page_title:
      document.title,

    referrer:
      document.referrer || '',

    client_timestamp:
      new Date().toISOString(),

    device:
      getDeviceType(),

    user_agent:
      navigator.userAgent || '',

    utm_source:
      attribution.utm_source,

    utm_medium:
      attribution.utm_medium,

    utm_campaign:
      attribution.utm_campaign,

    utm_term:
      attribution.utm_term,

    utm_content:
      attribution.utm_content,

    gclid:
      attribution.gclid,

    gbraid:
      attribution.gbraid,

    wbraid:
      attribution.wbraid
  };


  var params =
    new URLSearchParams(data);


  /*
   * Image beacon avoids CORS problems and
   * does not delay Call / WhatsApp.
   */

  var trackingImage =
    new Image();


  /*
   * Keep reference until request completes.
   */

  window.__gfcTrackingBeacons =
    window.__gfcTrackingBeacons || [];


  window.__gfcTrackingBeacons.push(
    trackingImage
  );


  function cleanupBeacon() {

    var index =
      window.__gfcTrackingBeacons.indexOf(
        trackingImage
      );

    if (index > -1) {

      window.__gfcTrackingBeacons.splice(
        index,
        1
      );
    }
  }


  trackingImage.onload =
    cleanupBeacon;

  trackingImage.onerror =
    cleanupBeacon;


  trackingImage.src =
    CTA_TRACKING_URL +
    '?' +
    params.toString() +
    '&_=' +
    Date.now();
}


/* ============================================================
   AUTOMATICALLY TRACK ALL DIRECT CALL + WHATSAPP LINKS
   ============================================================ */

document.addEventListener(
  'click',
  function (event) {

    var link =
      event.target.closest(
        'a[href^="tel:"], ' +
        'a[href*="api.whatsapp.com"], ' +
        'a[href*="wa.me"]'
      );

    if (!link) {
      return;
    }


    var href =
      link.getAttribute('href') || '';


    var eventType =
      /^tel:/i.test(href)
        ? 'call_click'
        : 'whatsapp_click';


    trackCTA(
      eventType,
      getButtonLocation(link),
      getButtonText(link),
      href
    );

  },
  false
);


/* ============================================================
   EXISTING FORM VALIDATION
   ============================================================ */

function setFieldError(
  input,
  errorId,
  hasError
) {

  input.classList.toggle(
    'field-error',
    hasError
  );

  if (errorId) {

    var errEl =
      document.getElementById(
        errorId
      );

    if (errEl) {

      errEl.classList.toggle(
        'show',
        hasError
      );
    }
  }
}


/* ============================================================
   RECORDS WORDING
   ============================================================ */

var RECORDS_PHRASE_MAP = {

  'Financial statements are ready':
    'fully prepared',

  'Accounts are still being prepared':
    'being prepared',

  "I'm not sure":
    'requiring your help'
};


/* ============================================================
   ELIGIBILITY FORM WHATSAPP BUTTON
   ============================================================ */

document
  .getElementById('chat-with-agent-btn')
  .addEventListener(
    'click',
    function () {

      var filedEl =
        document.getElementById(
          'lf-filed'
        );

      var recordsEl =
        document.getElementById(
          'lf-records'
        );

      var businessEl =
        document.getElementById(
          'lf-business'
        );


      var valid = true;


      /* Filed before */

      var filedOk =
        filedEl.value !== '';

      setFieldError(
        filedEl,
        'lf-filed-error',
        !filedOk
      );

      if (!filedOk) {
        valid = false;
      }


      /* Financial records */

      var recordsOk =
        recordsEl.value !== '';

      setFieldError(
        recordsEl,
        'lf-records-error',
        !recordsOk
      );

      if (!recordsOk) {
        valid = false;
      }


      /* Business type */

      var businessOk =
        businessEl.value !== '';

      setFieldError(
        businessEl,
        'lf-business-error',
        !businessOk
      );

      if (!businessOk) {
        valid = false;
      }


      /* Invalid form = don't count as WhatsApp click */

      if (!valid) {

        var firstError =
          document.querySelector(
            '.field-error'
          );

        if (firstError) {

          firstError.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });
        }

        return;
      }


      /* Build SBR WhatsApp message */

      var businessAnswer =
        businessEl.value;


      var recordsAnswer =
        RECORDS_PHRASE_MAP[
          recordsEl.value
        ] ||
        recordsEl.value;


      var message =
        "Hello GFC,\n\n" +
        "I have a " +
        businessAnswer +
        " with my financial records " +
        recordsAnswer +
        ".\n\n" +
        "Can you help me check my " +
        "Small Business Relief eligibility " +
        "and file?";


      var url =
        "https://api.whatsapp.com/send" +
        "?phone=971503098987" +
        "&text=" +
        encodeURIComponent(message);


      /*
       * Track the form WhatsApp click.
       *
       * This button is a <button>, not an <a>,
       * so it needs its own tracking call.
       */

      trackCTA(
        'whatsapp_click',
        'form',
        getButtonText(
          document.getElementById(
            'chat-with-agent-btn'
          )
        ),
        url
      );


      /* Open WhatsApp */

      window.open(
        url,
        '_blank',
        'noopener'
      );

    }
  );


/* ============================================================
   REMOVE FORM ERROR AFTER USER SELECTS VALUE
   ============================================================ */

[
  ['lf-filed', 'lf-filed-error'],
  ['lf-records', 'lf-records-error'],
  ['lf-business', 'lf-business-error']
]
.forEach(
  function (item) {

    var el =
      document.getElementById(
        item[0]
      );

    if (!el) return;


    el.addEventListener(
      'change',
      function () {

        if (el.value !== '') {

          setFieldError(
            el,
            item[1],
            false
          );
        }
      }
    );

  }
);


/* ============================================================
   TRUST STRIP SCROLL HINT
   ============================================================ */

var trustContainer =
  document.querySelector(
    '.trust-strip .container'
  );


var scrollHint =
  document.getElementById(
    'trust-scroll-hint'
  );


if (
  trustContainer &&
  scrollHint
) {

  function updateScrollHint() {

    var atEnd =

      trustContainer.scrollLeft +
      trustContainer.clientWidth

      >=

      trustContainer.scrollWidth -
      8;


    scrollHint.classList.toggle(
      'hidden',
      atEnd
    );
  }


  updateScrollHint();


  trustContainer.addEventListener(
    'scroll',
    updateScrollHint
  );


  window.addEventListener(
    'resize',
    updateScrollHint
  );
}

</script>
